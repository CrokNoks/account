<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvelle opération, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F7F7F5;--surface:#FFFFFF;--ink:#15181C;--muted:#5B636D;--line:#E3E4E0;--accent:#2450C8;--on-accent:#FFFFFF;--soft:#EEF0EC}
.t-dark{--bg:#111316;--surface:#181B1F;--ink:#ECEEF0;--muted:#A0A7B0;--line:#2A2F35;--accent:#6C90E8;--on-accent:#111316;--soft:#22262B}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
input::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; padding: 56px 16px 24px; background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600">Nouvelle opération</h1>
    <a href="MobileAccueil.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
  </header>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; background: var(--soft); border-radius: 10px" role="group" aria-label="Sens de l'opération">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
      <button type="button" onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" style="min-height: 44px; border-radius: 8px; background: {{k.bg}}; color: {{k.ink}}; font-weight: 500">{{k.label}}</button>
    </sc-for>
  </div>

  <label style="display: flex; flex-direction: column; gap: 4px">
    <span style="color: var(--muted); font-size: 14px">Montant</span>
    <span style="display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--accent); padding-bottom: 4px">
      <span class="num" aria-hidden="true" style="font-size: 40px; line-height: 1.1">{{sign}}</span>
      <input class="num" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" style="flex: 1; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 40px; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em">
      <span class="num" aria-hidden="true" style="font-size: 24px; color: var(--muted)">€</span>
    </span>
  </label>

  <label style="display: flex; flex-direction: column; gap: 4px">
    <span style="color: var(--muted); font-size: 14px">Libellé</span>
    <input type="text" placeholder="Boulangerie, loyer" onChange="{{typed}}" style="box-sizing: border-box; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface)">
  </label>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span id="cat-l" style="color: var(--muted); font-size: 14px">{{catHint}}</span>
    <div role="group" aria-labelledby="cat-l" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid {{c.rule}}; background: {{c.bg}}; color: {{c.ink}}; font-weight: 500">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface)">
    <span>Date</span>
    <input class="num" type="date" value="2026-11-06" style="border: 0; background: transparent; text-align: right">
  </label>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="MobileAccueil.dc.html" style="min-height: 52px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; display: flex; align-items: center; justify-content: center">Ajouter</a>
    <button type="button" style="min-height: 44px; font-weight: 500; color: var(--muted)">Ajouter et en saisir une autre</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'out', cat: null, label: '' };
  }
  renderVals() {
    const { kind, cat, label } = this.state;
    const rules = [[/boulang|super|march/i, 'Courses'], [/resto|brasserie|caf/i, 'Restaurants'], [/station|train|bus/i, 'Transports']];
    const hit = rules.find(([re]) => re.test(label));
    const suggested = hit ? hit[1] : null;
    const active = cat || suggested;
    const cats = ['Courses', 'Restaurants', 'Transports', 'Loisirs', 'Shopping', 'Autre'].map((name) => ({
      label: name,
      pressed: active === name ? 'true' : 'false',
      rule: active === name ? 'var(--ink)' : 'var(--line)',
      bg: active === name ? 'var(--ink)' : 'var(--surface)',
      ink: active === name ? 'var(--bg)' : 'var(--ink)',
      pick: () => this.setState({ cat: name }),
    }));
    return {
      themeClass: this.props.theme === 'sombre' ? 't-dark' : 't-light',
      sign: kind === 'out' ? '−' : '+',
      kinds: [['out', 'Dépense'], ['in', 'Revenu']].map(([id, text]) => ({
        label: text,
        pressed: kind === id ? 'true' : 'false',
        bg: kind === id ? 'var(--surface)' : 'transparent',
        ink: kind === id ? 'var(--ink)' : 'var(--muted)',
        pick: () => this.setState({ kind: id }),
      })),
      typed: (e) => this.setState({ label: e.target.value }),
      catHint: suggested && !cat ? 'Catégorie suggérée par vos règles' : 'Catégorie',
      cats,
    };
  }
}
</script>
</body>
</html>
