<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aujourd'hui, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F7F7F5;--surface:#FFFFFF;--ink:#15181C;--muted:#5B636D;--line:#E3E4E0;--accent:#2450C8;--on-accent:#FFFFFF;--warn:#B4530A;--s1:#2450C8;--s2:#6E8FE3;--s3:#A9BEF0;--s4:#D5DFF6;--soft:#EEF0EC}
.t-dark{--bg:#111316;--surface:#181B1F;--ink:#ECEEF0;--muted:#A0A7B0;--line:#2A2F35;--accent:#6C90E8;--on-accent:#111316;--warn:#CC7A36;--s1:#6C90E8;--s2:#5577CC;--s3:#3D5699;--s4:#2B3B66;--soft:#22262B}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.tab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;font-size:12px;color:var(--muted)}
</style>
</helmet>
<div class="{{themeClass}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.4">

  <main style="height: 100%; box-sizing: border-box; overflow-y: auto; padding: 56px 16px 96px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600">Aujourd'hui</h1>
      <span style="color: var(--muted); font-size: 13px">Jour 13 sur 31</span>
    </header>

    <section aria-labelledby="m-hero" style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 id="m-hero" style="margin: 0; font-size: 14px; font-weight: 500; color: var(--muted)">Prévu le 24 nov.</h2>
        <p class="num" style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 500; letter-spacing: -0.03em">2 030,00 €</p>
      </div>
      <div role="img" aria-label="Part du solde en banque : reste prévu, budget restant, factures, CB non pointées" style="display: flex; gap: 2px; height: 16px">
        <div style="flex: 203000 1 0; background: var(--s1); border-radius: 4px"></div>
        <div style="flex: 36174 1 0; background: var(--s2); border-radius: 4px"></div>
        <div style="flex: 19699 1 0; background: var(--s3); border-radius: 4px"></div>
        <div style="flex: 21480 1 0; background: var(--s4); border-radius: 4px"></div>
      </div>
      <dl style="margin: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: var(--muted)">En banque</dt><dd class="num" style="margin: 0">2 803,53 €</dd></div>
        <div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: var(--muted)">CB non pointées</dt><dd class="num" style="margin: 0">−214,80 €</dd></div>
        <div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: var(--muted)">Factures à venir</dt><dd class="num" style="margin: 0">−196,99 €</dd></div>
        <div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: var(--muted)">Budget restant</dt><dd class="num" style="margin: 0">−361,74 €</dd></div>
      </dl>
    </section>

    <section aria-labelledby="m-todo" style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 4px; display: flex; flex-direction: column">
      <h2 id="m-todo" style="margin: 0 0 4px; font-size: 16px; font-weight: 600">À traiter</h2>
      <sc-for list="{{todo}}" as="t" hint-placeholder-count="2">
        <a href="{{t.href}}" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line)">
          <span style="font-weight: 500">{{t.title}}</span>
          <span class="num">{{t.amount}}</span>
        </a>
      </sc-for>
    </section>

    <section aria-labelledby="m-budgets" style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="m-budgets" style="margin: 0; font-size: 16px; font-weight: 600">Budgets à surveiller</h2>
      <sc-for list="{{budgets}}" as="b" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; gap: 12px">
            <span style="font-weight: 500">{{b.name}}</span>
            <span class="num" style="color: {{b.ink}}; font-size: 14px">{{b.note}}</span>
          </div>
          <div style="position: relative; height: 10px; background: var(--soft); border-radius: 4px">
            <div style="height: 100%; width: {{b.pct}}; background: {{b.color}}; border-radius: 4px"></div>
            <div aria-hidden="true" style="position: absolute; left: 41.9%; top: -3px; bottom: -3px; border-left: 2px solid var(--ink)"></div>
          </div>
        </div>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 4px 8px 16px; background: var(--surface); border-top: 1px solid var(--line); display: flex; align-items: center">
    <a class="tab" href="MobileAccueil.dc.html" aria-current="page" style="color: var(--accent); font-weight: 500">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Aujourd'hui</a>
    <a class="tab" href="Operations.dc.html">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      Opérations</a>
    <a href="MobileSaisie.dc.html" aria-label="Nouvelle opération" style="flex: none; width: 52px; height: 52px; margin: 0 6px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a class="tab" href="Analyses.dc.html">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
      Analyses</a>
    <a class="tab" href="Budgets.dc.html">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9l6.5 6"></path></svg>
      Budgets</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      themeClass: this.props.theme === 'sombre' ? 't-dark' : 't-light',
      todo: [
        { title: '7 CB à pointer', amount: '214,80 €', href: 'Operations.dc.html' },
        { title: 'Doublon possible', amount: '42,10 €', href: 'Operations.dc.html' },
      ],
      budgets: [
        { name: 'Shopping', note: '37,50 € de trop', pct: '100%', color: 'var(--warn)', ink: 'var(--warn)' },
        { name: 'Restaurants', note: '11,10 € restants', pct: '94%', color: 'var(--accent)', ink: 'var(--muted)' },
      ],
    };
  }
}
</script>
</body>
</html>
