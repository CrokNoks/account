<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Opérations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F7F7F5;--surface:#FFFFFF;--ink:#15181C;--muted:#5B636D;--line:#E3E4E0;--accent:#2450C8;--on-accent:#FFFFFF;--warn:#B4530A;--soft:#EEF0EC}
.t-dark{--bg:#111316;--surface:#181B1F;--ink:#ECEEF0;--muted:#A0A7B0;--line:#2A2F35;--accent:#6C90E8;--on-accent:#111316;--warn:#CC7A36;--soft:#22262B}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
input::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav svg{flex:none}
.op:hover{background:var(--soft)}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Geist', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Navigation principale" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 20px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px">
      <span style="font-size: 12px; color: var(--muted)">Compte</span>
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; padding: 0; font-size: 15px; font-weight: 600; text-align: left">Compte commun
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <a class="nav" href="Main.dc.html">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        Aujourd'hui</a>
      <a class="nav" href="Operations.dc.html" aria-current="page" style="background: var(--soft); color: var(--ink)">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
        Opérations</a>
      <a class="nav" href="Analyses.dc.html">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg>
        Analyses</a>
      <a class="nav" href="Budgets.dc.html">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v9l6.5 6"></path></svg>
        Budgets</a>
      <a class="nav" href="Echeances.dc.html">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg>
        Échéances</a>
    </div>
    <a class="nav" href="#reglages" style="margin-top: auto">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      Réglages</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px) 40px">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

      <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Opérations</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <a href="#importer" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: flex; align-items: center; font-weight: 500">Importer un relevé</a>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600">Nouvelle opération</button>
        </div>
      </header>

      <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden">
        <div style="background: var(--surface); padding: 14px 20px; display: flex; flex-direction: column; gap: 2px">
          <dt style="color: var(--muted)">En banque, pointé</dt>
          <dd class="num" style="margin: 0; font-size: 22px; font-weight: 500">{{bank}}</dd>
        </div>
        <div style="background: var(--surface); padding: 14px 20px; display: flex; flex-direction: column; gap: 2px">
          <dt style="color: var(--muted)">À venir, CB comprises</dt>
          <dd class="num" style="margin: 0; font-size: 22px; font-weight: 500">2 588,73 €</dd>
        </div>
        <div style="background: var(--surface); padding: 14px 20px; display: flex; flex-direction: column; gap: 2px">
          <dt style="color: var(--muted)">Reste à pointer</dt>
          <dd class="num" style="margin: 0; font-size: 22px; font-weight: 500">{{toPoint}}</dd>
        </div>
      </dl>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
        <div style="display: flex; flex-wrap: wrap; gap: 4px" role="group" aria-label="Filtrer par état">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid {{f.rule}}; background: {{f.bg}}; color: {{f.ink}}; font-weight: 500">{{f.label}}</button>
          </sc-for>
        </div>
        <label style="flex: 0 1 280px; display: flex; flex-direction: column">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Rechercher une opération</span>
          <input type="search" placeholder="Libellé, catégorie" onChange="{{search}}" style="box-sizing: border-box; width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface)">
        </label>
      </div>

      <section aria-label="Liste des opérations" style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column">
            <h2 style="margin: 0; padding: 12px 8px 4px; font-size: 13px; font-weight: 500; color: var(--muted)">{{g.date}}</h2>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
              <div class="op" style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; min-height: 48px; padding: 4px 8px; border-radius: 8px">
                <span style="flex: 1 1 220px; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px">
                  <span style="font-weight: 500">{{r.label}}</span>
                  <span style="color: var(--muted); font-size: 13px">{{r.cat}}</span>
                  <sc-if value="{{r.dup}}" hint-placeholder-val="{{ false }}">
                    <span style="display: flex; align-items: center; gap: 4px; color: var(--warn); font-size: 13px; font-weight: 500">
                      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>
                      Doublon possible</span>
                  </sc-if>
                </span>
                <span class="num" style="flex: 0 0 110px; text-align: right; font-weight: 500">{{r.amount}}</span>
                <span style="flex: 0 0 150px; display: flex; justify-content: flex-end">
                  <sc-if value="{{r.canToggle}}" hint-placeholder-val="{{ true }}">
                    <button type="button" onClick="{{r.toggle}}" aria-pressed="{{r.pressed}}" style="min-height: 44px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: {{r.ink}}">
                      <span aria-hidden="true" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid currentColor; background: {{r.dot}}"></span>
                      {{r.status}}</button>
                  </sc-if>
                  <sc-if value="{{r.fixedState}}" hint-placeholder-val="{{ false }}">
                    <span style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted)">{{r.status}}</span>
                  </sc-if>
                </span>
              </div>
            </sc-for>
          </div>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 24px 8px; color: var(--muted)">Aucune opération pour ce filtre.</p>
        </sc-if>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', query: '', pointed: {} };
  }
  renderVals() {
    const eur = (c) => (c / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    const signed = (c) => (c > 0 ? '+' : '−') + eur(Math.abs(c));
    const ops = [
      { id: 'p4', date: '18 nov.', label: 'Mobile', cat: 'Énergie', cents: -3500, state: 'pending' },
      { id: 'p3', date: '15 nov.', label: 'Internet', cat: 'Énergie', cents: -4000, state: 'pending' },
      { id: 'p2', date: '12 nov.', label: 'Électricité', cat: 'Énergie', cents: -9200, state: 'pending' },
      { id: 'p1', date: '8 nov.', label: 'Salle de sport', cat: 'Abonnements', cents: -2999, state: 'pending' },
      { id: 'c1', date: '6 nov.', label: 'Boulangerie Martin', cat: 'Courses', cents: -860, state: 'cb' },
      { id: 'c2', date: '5 nov.', label: 'Pharmacie du Centre', cat: 'Santé', cents: -2300, state: 'cb' },
      { id: 'c3', date: '5 nov.', label: 'Brasserie du Port', cat: 'Restaurants', cents: -3850, state: 'cb' },
      { id: 'c4', date: '4 nov.', label: 'Station-service', cat: 'Transports', cents: -4430, state: 'cb' },
      { id: 'c5', date: '4 nov.', label: 'Librairie Lumière', cat: 'Loisirs', cents: -1620, state: 'cb' },
      { id: 'c6', date: '3 nov.', label: 'Supermarché Central', cat: 'Courses', cents: -4210, state: 'cb', dup: true },
      { id: 'c7', date: '3 nov.', label: 'Supermarché Central', cat: 'Courses', cents: -4210, state: 'cb', dup: true },
      { id: 'o1', date: '2 nov.', label: 'Assurance habitation', cat: 'Énergie', cents: -5800, state: 'ok' },
      { id: 'o2', date: '1 nov.', label: 'Loyer', cat: 'Logement', cents: -85000, state: 'ok' },
      { id: 'o3', date: '1 nov.', label: 'Charges', cat: 'Logement', cents: -13000, state: 'ok' },
    ];
    const { filter, query, pointed } = this.state;
    const stateOf = (o) => (o.state === 'cb' && pointed[o.id] ? 'ok' : o.state);
    const newlyPointed = ops.filter((o) => o.state === 'cb' && pointed[o.id]);
    const remaining = ops.filter((o) => stateOf(o) === 'cb');
    const bank = 280353 + newlyPointed.reduce((s, o) => s + o.cents, 0);
    const toPoint = remaining.reduce((s, o) => s - o.cents, 0);

    const filters = [['all', 'Toutes'], ['cb', 'À pointer · ' + remaining.length], ['pending', 'Factures à venir'], ['ok', 'Pointées']].map(([id, label]) => ({
      label,
      pressed: filter === id ? 'true' : 'false',
      rule: filter === id ? 'var(--ink)' : 'var(--line)',
      bg: filter === id ? 'var(--ink)' : 'var(--surface)',
      ink: filter === id ? 'var(--bg)' : 'var(--ink)',
      pick: () => this.setState({ filter: id }),
    }));

    const q = query.trim().toLowerCase();
    const visible = ops.filter((o) =>
      (filter === 'all' || stateOf(o) === filter) &&
      (!q || (o.label + ' ' + o.cat).toLowerCase().includes(q)));

    const groups = [];
    visible.forEach((o) => {
      const st = stateOf(o);
      const canToggle = o.state === 'cb';
      const row = {
        label: o.label,
        cat: o.cat,
        dup: !!o.dup,
        amount: signed(o.cents),
        canToggle,
        fixedState: !canToggle,
        pressed: st === 'ok' ? 'true' : 'false',
        status: st === 'ok' ? 'Pointée' : st === 'cb' ? 'À pointer' : 'Facture à venir',
        ink: st === 'ok' ? 'var(--muted)' : 'var(--accent)',
        dot: st === 'ok' ? 'currentColor' : 'transparent',
        toggle: () => this.setState({ pointed: { ...pointed, [o.id]: !pointed[o.id] } }),
      };
      const last = groups[groups.length - 1];
      if (last && last.date === o.date) last.rows.push(row);
      else groups.push({ date: o.date, rows: [row] });
    });

    return {
      themeClass: this.props.theme === 'sombre' ? 't-dark' : 't-light',
      bank: eur(bank),
      toPoint: eur(toPoint),
      filters,
      search: (e) => this.setState({ query: e.target.value }),
      groups,
      empty: groups.length === 0,
    };
  }
}
</script>
</body>
</html>
